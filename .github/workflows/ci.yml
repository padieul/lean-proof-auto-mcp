name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "ci/fix-ci"]

permissions:
  contents: read

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync deps (dev)
        run: uv sync --group dev

      - name: Ruff format (check)
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy -p lean_proof_auto_mcp

      - name: Pytest
        # Skip tests that require Lean 4 installation (integration tests and some unit tests)
        # Also skip xfail tests (known issues/limitations)
        # Also skip eval_investigation tests (manual investigation only, not for CI/CD)
        # Tests requiring Lean are marked with @pytest.mark.requires_lean
        # Expected failures are marked with @pytest.mark.xfail
        # Eval investigation tests are marked with @pytest.mark.eval_investigation
        run: uv run pytest -m "not requires_lean and not eval_investigation"
