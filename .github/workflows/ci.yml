name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "ci/fix-ci"]

permissions:
  contents: read

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync deps (dev)
        run: uv sync --group dev

      - name: Ruff format (check)
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy -p lean_proof_auto_mcp

      - name: Pytest
        # Fast CI profile across all Python versions:
        # - skip tests requiring local Lean installation
        # - skip heavy suites (property + eval tests) by marker and path
        run: >
          uv run pytest
          -m "not requires_lean and not heavy"
          --ignore=tests/property
          --ignore=tests/lean-proof-auto-mcp-eval_tests
