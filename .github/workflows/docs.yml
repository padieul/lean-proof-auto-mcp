name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install docs dependencies
        run: uv pip install --system -r docs/requirements.txt

      - name: Build docs
        run: python -m mkdocs build -f docs/mkdocs.yml --strict
