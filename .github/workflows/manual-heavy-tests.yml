name: Manual Heavy Tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heavy-tests:
    name: heavy + lean-dependent tests (py3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Sync deps (dev)
        run: uv sync --group dev

      - name: Run heavy suites (property + eval)
        run: >
          uv run pytest
          tests/property
          tests/lean-proof-auto-mcp-eval_tests
          -m "heavy"

      - name: Run Lean-dependent suites
        run: uv run pytest tests -m "requires_lean"
