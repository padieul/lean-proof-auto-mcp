version: "1.0"

# Test configuration with modified values to verify custom config loading
confidence:
  base_score: 0.15  # Modified from default 0.1
  bonuses:
    proof_structure: 0.25
    tactic_detection: 0.15
    structural_tactics: 0.1
    term_mode_patterns: 0.1
    automation_tactics: 0.1
    indentation_consistency: 0.05
  penalties:
    sorry: -0.5
    error_patterns: -0.3
  thresholds:
    proof_length_min: 3
    proof_length_max: 100
    proof_length_max_bonus: 0.1

aesop_scoring:
  base_score: 0.35  # Modified from default 0.3
  confidence_bonuses:
    high:
      threshold: 0.8
      bonus: 0.15
    medium:
      threshold: 0.6
      bonus: 0.1
    low:
      threshold: 0.4
      bonus: 0.05
  structural_tactics:
    bonus_per_tactic: 0.05
    max_bonus: 0.15
  term_mode:
    bonus_per_pattern: 0.03
    max_bonus: 0.1
  proof_length_bonuses:
    - max_lines: 5
      bonus: 0.15
    - max_lines: 10
      bonus: 0.1
    - max_lines: 20
      bonus: 0.05
  penalties:
    rewrite_heavy:
      threshold: 10
      penalty: -0.15
    rewrite_moderate:
      threshold: 5
      penalty: -0.08
    simp_heavy:
      threshold: 5
      penalty: -0.1
  bonuses:
    tactic_mode: 0.05

grind_scoring:
  base_score: 0.35  # Modified from default 0.3
  confidence_bonuses:
    high:
      threshold: 0.8
      bonus: 0.15
    medium:
      threshold: 0.6
      bonus: 0.1
    low:
      threshold: 0.4
      bonus: 0.05
  rewrite:
    bonus_per_count: 0.03
    max_bonus: 0.15
  simp:
    bonus_per_count: 0.02
    max_bonus: 0.1
  algebraic_terms:
    bonus_per_pattern: 0.04
    max_bonus: 0.15
  proof_length_bonuses:
    - min_lines: 5
      max_lines: 30
      bonus: 0.1
    - max_lines: 3
      bonus: 0.08
  penalties:
    induction: -0.2
    cases: -0.15
  algebraic_tactics:
    bonus_per_tactic: 0.05
    max_bonus: 0.15
  bonuses:
    pure_term_proof: 0.1

annotation_value_scoring:
  base_score: 0.3
  confidence_bonuses:
    high:
      threshold: 0.8
      bonus: 0.15
    medium:
      threshold: 0.6
      bonus: 0.1
  penalties:
    low_confidence: -0.15
  proof_length_bonuses:
    - min_lines: 20
      bonus: 0.15
    - min_lines: 10
      bonus: 0.1
    - min_lines: 5
      bonus: 0.05
  local_lemmas:
    bonus_per_count: 0.05
    max_bonus: 0.2
  tactic_diversity_bonuses:
    - min_diversity: 5
      bonus: 0.1
    - min_diversity: 3
      bonus: 0.05
  rewrite_bonuses:
    - min_count: 5
      bonus: 0.1
    - min_count: 3
      bonus: 0.05
  simp_bonuses:
    - min_count: 3
      bonus: 0.08
    - min_count: 2
      bonus: 0.04
  bonuses:
    term_application: 0.05
    structural_proof: 0.08

subgoal_potential_scoring:
  confidence_multipliers:
    high:
      threshold: 0.8
      multiplier: 1.0
    medium:
      threshold: 0.6
      multiplier: 0.8
    low:
      threshold: 0.4
      multiplier: 0.6
  bonuses:
    induction_or_cases: 0.3
    term_application: 0.1
    algebraic_term: 0.15
  structure_cases:
    bonus_per_case: 0.1
    max_bonus: 0.3
  rewrite_blocks:
    bonus_per_block: 0.08
    max_bonus: 0.25

risk_scoring:
  global_change_risk:
    rewrite_heavy:
      threshold: 10
      risk: 0.7
    simp_heavy:
      threshold: 5
      risk: 0.8
    simp_question_mark: 0.9
  simp_risk:
    heavy:
      threshold: 5
      risk: 0.6
    moderate:
      threshold: 3
      risk: 0.4
  local_lemma_risk:
    heavy:
      threshold: 5
      risk: 0.5
    moderate:
      threshold: 3
      risk: 0.3
  low_confidence_risk:
    very_low:
      threshold: 0.3
      risk: 0.7
    low:
      threshold: 0.5
      risk: 0.4
  component_weights:
    global_change: 0.3
    simp: 0.25
    local_lemma: 0.25
    confidence: 0.2

impact_scoring:
  proof_length_scores:
    - min_lines: 50
      score: 1.0
    - min_lines: 30
      max_lines: 49
      score: 0.8
    - min_lines: 15
      max_lines: 29
      score: 0.6
    - min_lines: 5
      max_lines: 14
      score: 0.4
    - max_lines: 4
      score: 0.2
  reusability:
    score_per_local_lemma: 0.1
    max_score: 0.3
  component_weights:
    proof_length: 0.5
    annotation_value: 0.3
    reusability: 0.2

success_likelihood_scoring:
  complexity_penalties:
    induction_or_cases: 0.2
    long_proof:
      threshold: 50
      penalty: 0.3
    many_local_lemmas:
      threshold: 5
      penalty: 0.25
    max_penalty: 0.5
  component_weights:
    max_potential: 0.5
    confidence: 0.3
    complexity_penalty: -0.2

objectives:
  maximize_success:
    description: "Prioritize theorems most likely to be automated successfully"
    use_case: "When you want quick wins and high success rate"
    weights:
      success_likelihood: 0.50
      impact: 0.10
      annotation_value: 0.10
      subgoal_potential: 0.10
      risk: -0.20
  maximize_impact:
    description: "Prioritize theorems that save the most time when automated"
    use_case: "When you want maximum ROI on automation effort"
    weights:
      success_likelihood: 0.20
      impact: 0.40
      annotation_value: 0.30
      subgoal_potential: 0.05
      risk: -0.05
  maximize_subgoal_automation:
    description: "Prioritize theorems with good partial automation opportunities"
    use_case: "When you want to automate proof steps rather than whole goals"
    weights:
      success_likelihood: 0.15
      impact: 0.15
      annotation_value: 0.20
      subgoal_potential: 0.40
      risk: -0.10
  balanced:
    description: "Balanced weighting across all factors"
    use_case: "When you want a general-purpose ranking"
    weights:
      success_likelihood: 0.25
      impact: 0.25
      annotation_value: 0.20
      subgoal_potential: 0.20
      risk: -0.10

already_automated:
  penalties:
    tactic_usage: 0.3
    attribute: 0.5
    trivial_proof: 0.8
  tactic_patterns:
    - "by aesop"
    - "by grind"
    - "by simp"
    - "aesop"
    - "grind"
    - "simp"
  attribute_patterns:
    - "@[aesop"
    - "@[simp"
  trivial_patterns:
    - ":= by rfl"
    - ":= rfl"
    - ":= trivial"
    - "by rfl"
    - "by trivial"

tiers:
  s_tier_percentile: 10.0
  a_tier_percentile: 25.0
  b_tier_percentile: 50.0
  c_tier_percentile: 75.0
